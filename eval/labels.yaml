# Ground-truth labels for the eval harness. A HUMAN FILLS THESE IN, NOT THE AGENT.
#
# How to fill this in (about 15 minutes):
#   1. cp eval/labels.template.yaml eval/labels.yaml
#   2. Start the portal on a FRESH database (python reset_sandbox.py; uvicorn ...) and log in as
#      agent.demo. Open each fax in Fax Management -> Inbound Faxes, read EVERY page of the preview or
#      downloaded PDF yourself, and decide what a careful human router should do under the SOP.
#      Do NOT copy from results.json, the agent's logs, the extraction cache, data/faxes or manifest.json.
#      Labels copied from the system under test measure nothing.
#   3. Fill every field below. `python -m eval.run_eval` refuses to score while any required field is blank.
#
# Fields
#   expected_action:       routed | needs_review | skipped_duplicate | already_routed
#                          (already_routed = the portal already showed Routed before any agent run)
#   expected_category:     referral | lab_result | imaging_report | prior_authorization | refill_request |
#                          records_request | eob | mixed | unclear
#                          The document type you see, even when the action is needs_review (an urgent lab
#                          result is `lab_result`). Use `mixed` for a packet with more than one category
#                          and `unclear` when the type cannot be established from the pages.
#   expected_route:        the route that should be SUBMITTED. One of:
#                            auto  -> derived from the brief's SOP table (ORACLE_SOP in eval/metrics.py, an
#                                     independent copy, not the agent's agent/sop.py): the category's row for
#                                     `routed`, the Manual Review row for `needs_review`
#                            none  -> nothing should be submitted (skipped_duplicate, already_routed)
#                            or the three exact dropdown labels:
#                              expected_route: {assigned_to: "...", doc_type: "...", folder: "..."}
#   expected_duplicate_of: required only when expected_action is skipped_duplicate: the fax ID of the
#                          earliest-received original. Leave blank otherwise.
#   notes:                 optional: your evidence / reasoning (helps when a disagreement is reviewed).
#
# SOP dropdown values (copy exactly if you write routes out by hand):
#   Olivia Chen - Referrals            | Referral            | Referrals / New
#   Noah Patel - Clinical Review       | Lab Result          | Clinical / Labs
#   Noah Patel - Clinical Review       | Imaging Report      | Clinical / Imaging
#   Ethan Brooks - Authorizations      | Prior Authorization | Authorizations / Pending
#   Ava Wilson - Nursing / Medication  | Refill Request      | Nursing / Medication
#   Mia Gomez - Medical Records        | Records Request     | Records / Requests
#   Liam Rivera - Billing              | EOB                 | Billing / EOBs
#   Jordan Ellis - Manual Review       | Needs Review        | Review / Unclassified

# Provenance: the labeller read every page of every fax in the portal UI (routing panel covered) and wrote
# blind notes. Labels marked "labeller" are their own call. Labels marked "resolved" were uncertain or
# contradicted the SOP in the notes and were settled by applying the SOP with AI assistance; the
# labeller's original note is kept in each case.
labeller:       Aarnav Noble
labelled_at:    2026-11-06
faxes:
  FX-201:
    expected_action: routed
    expected_category: referral
    expected_route: auto
    expected_duplicate_of:
    notes: "labeller: page 2 is explicitly a referral request, with referring physician, service and reason"
  FX-202:
    expected_action: needs_review
    expected_category: lab_result
    expected_route: auto
    expected_duplicate_of:
    notes: "labeller: lab result marked CRITICAL RESULT and 'for immediate review'"
  FX-203:
    expected_action: routed
    expected_category: imaging_report
    expected_route: auto
    expected_duplicate_of:
    notes: "resolved: labeller identified an imaging report but was unsure of the action; no review trigger applies (no flag, single document, findings present)"
  FX-204:
    expected_action: routed
    expected_category: prior_authorization
    expected_route: auto
    expected_duplicate_of:
    notes: "resolved: labeller first said needs_review because of 'please review coverage requirements'; that is the Authorizations team's normal work, not an SOP review trigger"
  FX-205:
    expected_action: routed
    expected_category: refill_request
    expected_route: auto
    expected_duplicate_of:
    notes: "resolved: labeller leaned needs_review because of 'no dispensing authorization implied'; that is a standard disclaimer, not an SOP review trigger"
  FX-206:
    expected_action: routed
    expected_category: records_request
    expected_route: auto
    expected_duplicate_of:
    notes: "resolved: labeller noted page 2 is the signed release for the records request (one document); first labelled already_routed through a definition mix-up"
  FX-207:
    expected_action: routed
    expected_category: eob
    expected_route: auto
    expected_duplicate_of:
    notes: "labeller: explanation of benefits per the title; content is billed, paid and owed amounts"
  FX-208:
    expected_action: needs_review
    expected_category: lab_result
    expected_route: auto
    expected_duplicate_of:
    notes: "labeller: results say 'see following table' but no table follows; contradicting info, so take the safer option and review"
  FX-209:
    expected_action: needs_review
    expected_category: unclear
    expected_route: auto
    expected_duplicate_of:
    notes: "labeller: seems incomplete, no usable info; needs a closer look"
  FX-210:
    expected_action: skipped_duplicate
    expected_category: referral
    expected_route: none
    expected_duplicate_of: FX-201
    notes: "labeller: resend saying to disregard if the original was received; the original RF-3001 (same patient and DOB) is FX-201, received earlier"
  FX-211:
    expected_action: already_routed
    expected_category: imaging_report
    expected_route: none
    expected_duplicate_of:
    notes: "resolved: labeller read a final imaging report and first said routed; it was already Routed in the portal's seed state, before any agent run"
  FX-212:
    expected_action: needs_review
    expected_category: mixed
    expected_route: auto
    expected_duplicate_of:
    notes: "labeller: contains both a lab report and a radiology report, so unclear; two document types in one fax means mixed"
